version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16 (App Router, Turbopack)
  - React 19
  - Tailwind CSS 4
  - Radix UI
  - Framer Motion
  - NextAuth v5 (Credentials)
  - Drizzle ORM + PostgreSQL
  - BullMQ + ioredis
  - OpenAI SDK
  - next-intl (EN, VI)
  - Zustand
  - Zod
  - Vitest
routes:
  - path: /
    file: src/app/page.tsx
    auth_required: false
    description: Landing page (hero, features, pricing, FAQ, blog, CTA)
  - path: /login
    file: src/app/login/page.tsx
    auth_required: false
    description: Login page using NextAuth credentials
  - path: /register
    file: src/app/register/page.tsx
    auth_required: false
    description: User registration page
  - path: /reset-password
    file: src/app/reset-password/page.tsx
    auth_required: false
    description: Password reset request and token-based reset
  - path: /onboarding
    file: src/app/onboarding/page.tsx
    auth_required: true
    description: Multi-step onboarding wizard creating an AI study roadmap
  - path: /dashboard
    file: src/app/dashboard/page.tsx
    auth_required: true
    description: Dashboard home with active course resume and stats
  - path: /dashboard/courses
    file: src/app/dashboard/courses/page.tsx
    auth_required: true
    description: List of user roadmaps; switch active or create new course
  - path: /dashboard/plan
    file: src/app/dashboard/plan/page.tsx
    auth_required: true
    description: Detailed study plan / roadmap modules view
  - path: /dashboard/tests
    file: src/app/dashboard/tests/page.tsx
    auth_required: true
    description: Test practice view with quiz generation
  - path: /dashboard/profile
    file: src/app/dashboard/profile/page.tsx
    auth_required: true
    description: User learning profile with stats and roadmap summary
  - path: /dashboard/settings
    file: src/app/dashboard/settings/page.tsx
    auth_required: true
    description: Account, theme, language, and password reset settings
  - path: /privacy
    file: src/app/privacy/page.tsx
    auth_required: false
    description: Privacy policy page
  - path: /terms
    file: src/app/terms/page.tsx
    auth_required: false
    description: Terms of service page
features:
  - name: Landing Page
    description: Marketing landing page with hero, features, pricing, FAQ, testimonials, and CTAs that link into auth
    files:
      - src/app/page.tsx
      - src/components/landing/Hero.tsx
      - src/components/landing/Features.tsx
      - src/components/landing/PricingSection.tsx
      - src/components/landing/Footer.tsx
    entry_route: /
    user_interactions:
      - Scroll the page through hero, features, pricing, FAQ sections
      - Click navigation items in the navbar
      - Switch language between English and Vietnamese
      - Click "Get Started" or CTA button to navigate to register/login
      - Click footer links (privacy, terms)
    api_calls: []
    auth_required: false
  - name: User Registration
    description: Create a new account using name, email and password (8+ chars with letter + number/symbol)
    files:
      - src/app/register/page.tsx
      - src/components/auth/AuthScreen.tsx
      - src/app/actions/auth.ts
    entry_route: /register
    user_interactions:
      - Fill the name input field
      - Fill the email input field
      - Fill the password input field
      - Submit the registration form
      - See validation errors for short / weak passwords or duplicate email
      - On success, get redirected to login or onboarding
    api_calls:
      - method: POST
        endpoint: /api/auth/[...nextauth]
    auth_required: false
  - name: User Login
    description: Sign in with email and password using NextAuth credentials provider
    files:
      - src/app/login/page.tsx
      - src/components/auth/AuthScreen.tsx
      - src/auth.ts
    entry_route: /login
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click Login button
      - See error message on invalid credentials
      - Get redirected to /dashboard or /onboarding on success
      - Click "Forgot password" link to go to reset flow
    api_calls:
      - method: POST
        endpoint: /api/auth/[...nextauth]
    auth_required: false
  - name: Password Reset
    description: Request a password reset link and reset password using a token
    files:
      - src/app/reset-password/page.tsx
      - src/app/actions/auth.ts
    entry_route: /reset-password
    user_interactions:
      - Enter email address to request reset
      - Submit the request form and see confirmation
      - Open reset link with token in URL
      - Enter and confirm new password
      - Submit the reset form and be redirected to login
    api_calls: []
    auth_required: false
  - name: Onboarding Wizard
    description: Guided multi-step flow to capture user goals, interests, level and generate an AI roadmap
    files:
      - src/app/onboarding/page.tsx
      - src/components/onboarding/Step1.tsx
      - src/components/onboarding/Step2.tsx
      - src/components/onboarding/Step3.tsx
      - src/components/onboarding/StepGoals.tsx
      - src/app/actions/onboarding.ts
    entry_route: /onboarding
    user_interactions:
      - Choose a learning topic / subject
      - Select current skill level (beginner / intermediate / advanced)
      - Pick learning style and interests
      - Set a goal and target deadline
      - Submit the wizard to generate a roadmap
      - Wait for async generation and be redirected to /dashboard
    api_calls:
      - method: POST
        endpoint: /api/generate-roadmap
      - method: GET
        endpoint: /api/jobs/[id]
    auth_required: true
  - name: Dashboard Home
    description: Authenticated dashboard with active course progress and quick widgets
    files:
      - src/app/dashboard/page.tsx
      - src/components/dashboard/MainContent.tsx
      - src/components/dashboard/RightWidgets.tsx
      - src/components/dashboard/WorkspaceSidebar.tsx
    entry_route: /dashboard
    user_interactions:
      - View active course progress card
      - Click "Resume" to continue last module
      - Open sidebar navigation links
      - View widgets (streak, stats)
      - Switch language or theme from header
    api_calls: []
    auth_required: true
  - name: Courses Management
    description: List user roadmaps, switch active roadmap, create new course or delete existing ones
    files:
      - src/app/dashboard/courses/page.tsx
      - src/components/dashboard/courses/CoursesView.tsx
      - src/components/dashboard/courses/CourseCover.tsx
      - src/app/actions/onboarding.ts
    entry_route: /dashboard/courses
    user_interactions:
      - View list of generated roadmaps
      - Click a course to set it as active
      - Click "New Course" to start a new roadmap creation flow
      - Delete a roadmap and confirm in dialog
      - See progress percentage on each course
    api_calls: []
    auth_required: true
  - name: Study Plan & Modules
    description: Detailed roadmap of modules with completion tracking
    files:
      - src/app/dashboard/plan/page.tsx
      - src/components/dashboard/StudyPlan.tsx
      - src/app/actions/modules.ts
    entry_route: /dashboard/plan
    user_interactions:
      - Browse modules in the roadmap
      - Expand a module to view sub-topics
      - Mark a module complete or incomplete
      - See overall completion percentage update
    api_calls: []
    auth_required: true
  - name: Quiz / Test Practice
    description: AI-generated quiz on a selected topic with scoring
    files:
      - src/app/dashboard/tests/page.tsx
      - src/components/dashboard/tests/TestPracticeView.tsx
      - src/components/dashboard/quiz/QuizModal.tsx
    entry_route: /dashboard/tests
    user_interactions:
      - Select a module/topic
      - Click "Generate Quiz"
      - Wait for quiz to be generated (polling)
      - Answer multiple-choice questions
      - Submit and see score and explanations
    api_calls:
      - method: POST
        endpoint: /api/generate-quiz
      - method: GET
        endpoint: /api/jobs/[id]
    auth_required: true
  - name: Flashcards
    description: AI-generated flashcards for a topic with flip-and-review UX
    files:
      - src/components/dashboard/flashcards/FlashcardDeck.tsx
      - src/app/api/generate-flashcards/route.ts
    entry_route: /dashboard
    user_interactions:
      - Open a module's flashcards section
      - Click "Generate Flashcards"
      - Flip a card to reveal answer
      - Navigate next / previous card
      - Mark cards as known / review later
    api_calls:
      - method: POST
        endpoint: /api/generate-flashcards
      - method: GET
        endpoint: /api/jobs/[id]
    auth_required: true
  - name: AI Chat Coach
    description: Context-aware AI tutor chat with rate limiting
    files:
      - src/app/api/chat/route.ts
      - src/components/dashboard/MainContent.tsx
    entry_route: /dashboard
    user_interactions:
      - Open the chat panel
      - Type a question into the input
      - Send the message and see AI response stream/appear
      - Hit rate limit (after 15 req/min) and see throttled message
      - Clear chat or start a new conversation
    api_calls:
      - method: POST
        endpoint: /api/chat
    auth_required: true
  - name: Notes
    description: Per-module notes CRUD with title and markdown content
    files:
      - src/components/dashboard/notes/NotesPanel.tsx
      - src/app/actions/notes.ts
    entry_route: /dashboard
    user_interactions:
      - Open the notes panel
      - Create a new note with title and content
      - Edit an existing note
      - Delete a note with confirmation
      - See validation errors for too-long titles or content
    api_calls: []
    auth_required: true
  - name: Profile
    description: View user learning profile, stats and roadmap summary
    files:
      - src/app/dashboard/profile/page.tsx
    entry_route: /dashboard/profile
    user_interactions:
      - View name, email, current level
      - View total roadmaps and modules
      - View streak and completion stats
      - Navigate back to dashboard
    api_calls: []
    auth_required: true
  - name: Settings
    description: Manage theme, language and request password reset; sign out
    files:
      - src/app/dashboard/settings/page.tsx
    entry_route: /dashboard/settings
    user_interactions:
      - Toggle light / dark theme
      - Switch language between English and Vietnamese
      - Click "Request password reset" to send email
      - Click "Sign out" to log out
    api_calls: []
    auth_required: true
  - name: Health Check
    description: Public endpoint returning service status
    files:
      - src/app/api/health/route.ts
    entry_route: /api/health
    user_interactions:
      - Hit GET /api/health and receive {status:"ok", timestamp}
    api_calls:
      - method: GET
        endpoint: /api/health
    auth_required: false
known_limitations:
  - issue: Password reset emails are not actually delivered; tokens are stored in DB and must be retrieved manually
    location: src/app/actions/auth.ts
    impact: End-to-end password reset cannot be completed in tests without DB access to fetch the token
  - issue: AI generation endpoints are asynchronous via BullMQ and require a running worker process
    location: worker/index.ts and src/app/api/generate-*/route.ts
    impact: Without the worker running, /api/generate-roadmap, /api/generate-quiz, /api/generate-flashcards, /api/chat may stall or fail
  - issue: Free Plan rate limiting (15 req/min) on /api/chat
    location: src/app/api/chat/route.ts
    impact: High-frequency tests against chat will be throttled with 429
  - issue: Locale-prefixed routing is configured via next-intl but not all internal links use the locale prefix
    location: middleware.ts and various components/landing/Navbar.tsx
    impact: Some test scenarios that assert on /vi/... paths may need to use the non-prefixed URL
